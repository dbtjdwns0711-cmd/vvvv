<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장별 공정표 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .gantt-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .gantt-title { width: 240px; flex-shrink: 0; font-size: 13px; font-weight: 600; }
  .gantt-sub { font-size: 11px; color: #888; margin-top: 2px; }
  .gantt-track { flex-grow: 1; position: relative; height: 26px; background: #f1f3f5; border-radius: 13px; margin: 0 15px; }
  .gantt-bar-box { position: absolute; height: 100%; background: #dbeafe; border-radius: 13px; overflow: hidden; border: 1px solid #93c5fd; }
  .gantt-bar-fill { height: 100%; background: #2563eb; transition: width 0.3s ease; }
  .gantt-rate { width: 90px; text-align: right; flex-shrink: 0; font-size: 13px; font-weight: bold; color: #2563eb; }
  .progress-slider { width: 60px; margin-left: 10px; cursor: pointer; }
</style>
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="page-content">
      <div class="page-head flex-between">
        <div>
          <h2 id="proj-title">현장 공정 상세분석</h2>
          <div class="desc" id="proj-desc">공사 물량·생산성 산정에서 계산된 작업일수 기반 간트차트 공정표입니다.</div>
        </div>
        <div style="display:flex; gap:10px;">
          <a href="quantity.html" class="btn btn-primary" style="font-size:12px;">+ 공사 물량·작업량 산정하기</a>
          <a href="analysis.html" class="btn" style="border:1px solid #ccc; padding:6px 12px; font-size:12px;">← 현장 목록</a>
        </div>
      </div>

      <!-- 현장 요약 패널 -->
      <div class="panel" style="margin-bottom: 20px;">
        <div class="panel-head flex-between">
          <h3 id="target-proj-name">현장 정보</h3>
          <span class="hint">전체 평균 공정률: <strong id="overall-rate" style="color:#2563eb; font-size:15px;">0%</strong></span>
        </div>
        <div style="font-size:13px; color:var(--ink-soft); display:flex; gap:25px;">
          <div>공사 기간: <strong id="proj-period" style="color:#222;">-</strong></div>
          <div>등록된 공종 수: <strong id="task-count" style="color:#222;">0개</strong></div>
        </div>
      </div>

      <!-- 간트차트 출력 -->
      <div class="panel">
        <div class="panel-head flex-between">
          <h3>공정 진행 간트차트 (Gantt Chart)</h3>
          <span class="hint" id="timeline-range-text">타임라인</span>
        </div>
        
        <div id="gantt-header" style="display:flex; border-bottom: 2px solid #ddd; padding: 10px 0; font-weight: bold; font-size: 13px; color: #555;">
          <div style="width: 240px; flex-shrink: 0;">산출 공종 (산정 물량 및 소요일)</div>
          <div style="flex-grow: 1; margin: 0 15px;">진행 타임라인</div>
          <div style="width: 90px; text-align: right; flex-shrink: 0;">진행률 조정</div>
        </div>

        <div id="gantt-body"></div>
      </div>
    </main>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script>
let currentProjectId = "";
let allTasksByProject = JSON.parse(localStorage.getItem('my_project_tasks_map') || '{}');

function initPage() {
  const db = loadDB();
  const urlParams = new URLSearchParams(window.location.search);
  currentProjectId = urlParams.get('id') || getCurrentProjectId(db) || (db.projects[0] ? db.projects[0].id : "p1");

  const project = db.projects.find(x => x.id === currentProjectId) || db.projects[0];
  if (!project) return;

  document.getElementById('proj-title').textContent = `${project.name} 공정 상세분석`;
  document.getElementById('target-proj-name').textContent = project.name;
  document.getElementById('proj-desc').textContent = `${project.location || '위치 미지정'} · 산출 작업량 기준 일정 현황`;
  document.getElementById('proj-period').textContent = `${project.startDate} ~ ${project.endDate}`;

  renderGantt();
}

function updateProgress(taskId, val) {
  const tasks = allTasksByProject[currentProjectId] || [];
  const task = tasks.find(t => t.id === taskId);
  if (task) {
    task.progress = parseInt(val, 10);
    localStorage.setItem('my_project_tasks_map', JSON.stringify(allTasksByProject));
    renderGantt();
  }
}

function renderGantt() {
  const body = document.getElementById('gantt-body');
  const rateEl = document.getElementById('overall-rate');
  const countEl = document.getElementById('task-count');
  const timelineText = document.getElementById('timeline-range-text');
  const tasks = allTasksByProject[currentProjectId] || [];

  countEl.textContent = `${tasks.length}개`;

  if (!tasks.length) {
    body.innerHTML = `
      <div style="padding: 40px; text-align: center; color: #888;">
        아직 산정된 공사 물량이 없습니다.<br>
        우측 상단의 <strong>[+ 공사 물량·작업량 산정하기]</strong> 버튼을 눌러 공종별 물량을 입력해 주세요.
      </div>
    `;
    rateEl.textContent = '0%';
    timelineText.textContent = '타임라인';
    return;
  }

  const starts = tasks.map(t => new Date(t.start).getTime());
  const ends = tasks.map(t => new Date(t.end).getTime());
  const minTime = Math.min(...starts);
  const maxTime = Math.max(...ends);
  const totalRange = maxTime - minTime || 86400000;

  const avg = Math.round(tasks.reduce((sum, t) => sum + (t.progress || 0), 0) / tasks.length);
  rateEl.textContent = `${avg}%`;

  const minDateStr = new Date(minTime).toISOString().slice(0, 10);
  const maxDateStr = new Date(maxTime).toISOString().slice(0, 10);
  timelineText.textContent = `전체 기간: ${minDateStr} ~ ${maxDateStr}`;

  body.innerHTML = tasks.map(t => {
    const sTime = new Date(t.start).getTime();
    const eTime = new Date(t.end).getTime();

    const left = Math.max(0, ((sTime - minTime) / totalRange) * 100);
    const width = Math.max(3, Math.min(100 - left, ((eTime - sTime + 86400000) / totalRange) * 100));

    return `
      <div class="gantt-row">
        <div class="gantt-title">
          <div>${t.name}</div>
          <div class="gantt-sub">${t.start} ~ ${t.end} (${t.days || 1}일 소요)</div>
        </div>
        <div class="gantt-track">
          <div class="gantt-bar-box" style="left: ${left}%; width: ${width}%;">
            <div class="gantt-bar-fill" style="width: ${t.progress || 0}%;"></div>
          </div>
        </div>
        <div class="gantt-rate">
          ${t.progress || 0}%
          <input type="range" class="progress-slider" min="0" max="100" value="${t.progress || 0}" 
                 onchange="updateProgress(${t.id}, this.value)">
        </div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('현장별 상세분석', { showProjectSelect: false });
  initPage();
});
</script>
</body>
</html>
