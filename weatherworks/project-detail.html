<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장별 상세분석 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .gantt-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .gantt-title { width: 220px; flex-shrink: 0; font-size: 13px; font-weight: 600; }
  .gantt-sub { font-size: 11px; color: #888; margin-top: 2px; }
  .gantt-track { flex-grow: 1; position: relative; height: 26px; background: #f1f3f5; border-radius: 13px; margin: 0 15px; }
  .gantt-bar-box { position: absolute; height: 100%; background: #dbeafe; border-radius: 13px; overflow: hidden; border: 1px solid #93c5fd; }
  .gantt-bar-fill { height: 100%; background: #2563eb; transition: width 0.3s ease; }
  .gantt-rate { width: 70px; text-align: right; flex-shrink: 0; font-size: 13px; font-weight: bold; color: #2563eb; }
</style>
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="page-content">
      <div class="page-head">
        <h2>현장별 상세분석 (공정 진행 현황)</h2>
        <div class="desc">선택된 현장의 공사 물량·생산성 산정 데이터 및 공기 기준에 따른 간트차트 공정 현황을 조회합니다.</div>
      </div>

      <!-- 현장 기본 요약 정보 -->
      <div class="panel" style="margin-bottom: 20px;">
        <div class="panel-head flex-between">
          <h3 id="proj-name">현장 공정 요약</h3>
          <span class="hint" id="proj-period"></span>
        </div>
        <div style="display:flex; gap:20px; font-size:13px; color:var(--ink-soft); padding: 5px 0;">
          <div>관측지점: <strong id="proj-station" style="color:#222;">-</strong></div>
          <div>총 공사기간: <strong id="proj-duration" style="color:#222;">0일</strong></div>
          <div>전체 평균 공정률: <strong id="overall-rate" style="color:#2563eb; font-size:15px;">0%</strong></div>
        </div>
      </div>

      <!-- 간트차트 패널 -->
      <div class="panel">
        <div class="panel-head flex-between">
          <h3>공정 진행 간트차트 (Gantt Chart)</h3>
          <span class="hint" id="task-count-hint"></span>
        </div>
        
        <div id="gantt-header" style="display:flex; border-bottom: 2px solid #ddd; padding: 10px 0; font-weight: bold; font-size: 13px; color: #555;">
          <div style="width: 220px; flex-shrink: 0;">공종 구분 (물량산출 연동)</div>
          <div style="flex-grow: 1; margin: 0 15px;" id="timeline-range-text">공정 타임라인</div>
          <div style="width: 70px; text-align: right; flex-shrink: 0;">공정률</div>
        </div>

        <div id="gantt-body"></div>
      </div>
    </main>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script>
function renderProjectGantt() {
  const db = loadDB();
  const pid = getCurrentProjectId(db);
  const project = db.projects.find(x => x.id === pid) || db.projects[0];

  if (!project) return;

  // 현장 정보 바인딩
  document.getElementById('proj-name').textContent = project.name;
  document.getElementById('proj-period').textContent = `${project.startDate} ~ ${project.endDate}`;
  document.getElementById('proj-duration').textContent = `${daysBetween(project.startDate, project.endDate)}일`;

  const station = (db.stations || []).find(s => s.id === project.stationId);
  document.getElementById('proj-station').textContent = station ? `${station.name} (${station.id})` : '지점 미지정';

  // 물량산출(quantities) 또는 공종(workTypes)에서 공정 목록 도출
  let tasks = [];
  const projectQuantities = (db.quantities || []).filter(q => q.projectId === project.id);

  if (projectQuantities.length > 0) {
    // 물량 산정이 등록되어 있는 경우
    let currentStart = new Date(project.startDate).getTime();

    tasks = projectQuantities.map((item, idx) => {
      const days = item.calculatedDays || 15; // 산정된 일수 또는 기본 15일
      const tStart = new Date(currentStart);
      const tEnd = new Date(currentStart + (days - 1) * 86400000);
      currentStart = tEnd.getTime() + 86400000; // 후속 공종 순차 배치

      return {
        name: item.itemSpec || item.workTypeName || `공종 #${idx + 1}`,
        start: tStart.toISOString().slice(0, 10),
        end: tEnd.toISOString().slice(0, 10),
        days: days,
        progress: item.progress !== undefined ? item.progress : Math.min(100, Math.max(0, 100 - idx * 25))
      };
    });
  } else {
    // 물량이 아직 등록되지 않은 기본 공종의 경우 가상 분할 생성
    const pStart = new Date(project.startDate).getTime();
    const pEnd = new Date(project.endDate).getTime();
    const totalDays = Math.max(1, Math.round((pEnd - pStart) / 86400000));
    const workTypes = (db.workTypes || []).filter(w => (project.workTypeIds || []).includes(w.id));
    const count = workTypes.length || 1;
    const splitDays = Math.floor(totalDays / count);

    tasks = workTypes.map((wt, idx) => {
      const tStart = new Date(pStart + idx * splitDays * 86400000);
      const tEnd = new Date(idx === count - 1 ? pEnd : pStart + ((idx + 1) * splitDays - 1) * 86400000);
      return {
        name: wt.name,
        start: tStart.toISOString().slice(0, 10),
        end: tEnd.toISOString().slice(0, 10),
        days: Math.round((tEnd - tStart) / 86400000) + 1,
        progress: Math.min(100, Math.max(0, 90 - idx * 30))
      };
    });
  }

  // 간트차트 렌더링
  const body = document.getElementById('gantt-body');
  const rateEl = document.getElementById('overall-rate');
  const countHint = document.getElementById('task-count-hint');
  const timelineText = document.getElementById('timeline-range-text');

  if (!tasks.length) {
    body.innerHTML = '<div style="padding:30px; text-align:center; color:#888;">등록된 공종 정보가 없습니다. [공사 물량·생산성 산정]에서 물량을 추가해 주세요.</div>';
    rateEl.textContent = '0%';
    return;
  }

  countHint.textContent = `총 ${tasks.length}개 공종 연동`;
  const pStart = new Date(project.startDate).getTime();
  const pEnd = new Date(project.endDate).getTime();
  const totalDuration = pEnd - pStart || 86400000;

  const avgProgress = Math.round(tasks.reduce((sum, t) => sum + t.progress, 0) / tasks.length);
  rateEl.textContent = `${avgProgress}%`;
  timelineText.textContent = `공정 타임라인 (${project.startDate} ~ ${project.endDate})`;

  body.innerHTML = tasks.map(t => {
    const tStart = new Date(t.start).getTime();
    const tEnd = new Date(t.end).getTime();

    const left = Math.max(0, ((tStart - pStart) / totalDuration) * 100);
    const width = Math.max(2, Math.min(100 - left, ((tEnd - tStart + 86400000) / totalDuration) * 100));

    return `
      <div class="gantt-row">
        <div class="gantt-title">
          <div>${t.name}</div>
          <div class="gantt-sub">${t.start} ~ ${t.end} (${t.days}일 소요)</div>
        </div>
        <div class="gantt-track">
          <div class="gantt-bar-box" style="left: ${left}%; width: ${width}%;">
            <div class="gantt-bar-fill" style="width: ${t.progress}%;"></div>
          </div>
        </div>
        <div class="gantt-rate">${t.progress}%</div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  renderTopbar('현장별 상세분석', { showProjectSelect: true });
  renderProjectGantt();

  // 상단 현장 선택 셀렉트박스 변경 감지 시 차트 자동 갱신
  const sel = document.getElementById('topbar-project-select');
  if (sel) {
    sel.addEventListener('change', () => {
      renderProjectGantt();
    });
  }
});
</script>
</body>
</html>
