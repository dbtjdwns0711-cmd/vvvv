<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구간별 관측지점 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="page-content">
      <div class="page-head flex-between">
        <div>
          <h2>공사 구간별 관측지점</h2>
          <div class="desc">현장(구간)에 매칭할 기상 관측지점을 관리합니다. 현장 관리에서 이 목록 중 하나를 선택해 연결합니다.</div>
        </div>
        <button class="btn btn-primary" onclick="openForm()">+ 관측지점 추가</button>
      </div>

      <div class="panel">
        <table>
          <thead><tr><th>지점명</th><th>지점 코드</th><th>지역</th><th>연결된 현장</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="panel" id="form-panel" style="display:none; margin-top:16px;">
        <div class="panel-head"><h3 id="form-title">관측지점 추가</h3></div>
        <div class="field-row">
          <div class="field"><label>지점명</label><input id="f-name" type="text" placeholder="예) 현장 인근 관측소 A"></div>
          <div class="field"><label>지점 코드</label><input id="f-code" type="text" placeholder="예) 108"></div>
          <div class="field"><label>지역</label><input id="f-region" type="text" placeholder="예) 서울"></div>
        </div>
        <div class="row gap-8">
          <button class="btn btn-primary" onclick="save()">저장</button>
          <button class="btn" onclick="closeForm()">취소</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script src="js/sw-catalog.js"></script>
<script>
let editingId = null;
function render(){
  const db = loadDB();
  document.getElementById('rows').innerHTML = db.stations.map(s=>{
    const linked = db.projects.filter(p=>p.stationId===s.id).map(p=>p.name).join(', ') || '-';
    return `<tr>
      <td><b>${s.name}</b></td><td class="mono">${s.code||'-'}</td><td>${s.region||'-'}</td><td>${linked}</td>
      <td class="row gap-8">
        <button class="btn btn-sm" onclick="edit('${s.id}')">수정</button>
        <button class="btn btn-sm btn-danger" onclick="remove('${s.id}')">삭제</button>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5"><div class="empty">등록된 관측지점이 없습니다.</div></td></tr>';
}
function openForm(){
  editingId = null;
  document.getElementById('form-title').textContent = '관측지점 추가';
  document.getElementById('f-name').value = '';
  document.getElementById('f-code').value = '';
  document.getElementById('f-region').value = '';
  document.getElementById('form-panel').style.display = 'block';
}
function closeForm(){ document.getElementById('form-panel').style.display = 'none'; }
function edit(id){
  const db = loadDB();
  const s = db.stations.find(x=>x.id===id);
  if(!s) return;
  editingId = id;
  document.getElementById('form-title').textContent = '관측지점 수정';
  document.getElementById('f-name').value = s.name;
  document.getElementById('f-code').value = s.code||'';
  document.getElementById('f-region').value = s.region||'';
  document.getElementById('form-panel').style.display = 'block';
}
function save(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('지점명을 입력하세요.'); return; }
  const db = loadDB();
  const payload = {name, code: document.getElementById('f-code').value.trim(), region: document.getElementById('f-region').value.trim()};
  if(editingId){
    const idx = db.stations.findIndex(s=>s.id===editingId);
    db.stations[idx] = {...db.stations[idx], ...payload};
  } else {
    db.stations.push({id: uid('st'), ...payload});
  }
  saveDB(db); closeForm(); render();
}
function remove(id){
  const db = loadDB();
  if(db.projects.some(p=>p.stationId===id)){ alert('이 관측지점을 사용 중인 현장이 있습니다. 먼저 현장의 관측지점을 변경하세요.'); return; }
  if(!confirm('삭제하시겠습니까?')) return;
  db.stations = db.stations.filter(s=>s.id!==id);
  saveDB(db); render();
}
document.addEventListener('DOMContentLoaded', ()=>{ renderTopbar('공사 구간별 관측지점'); render(); });
</script>
</body>
</html>
