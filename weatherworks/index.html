<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종합 현황 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="page-content">
      <div class="page-head">
        <h2>종합 현황</h2>
        <div class="desc">전체 현장의 작업 가능률과 비작업일수 현황을 한눈에 확인합니다.</div>
      </div>

      <div class="grid grid-4" id="stat-cards"></div>

      <div class="panel" style="margin-top:16px;">
        <div class="panel-head">
          <h3>현장별 요약</h3>
          <span class="hint">클릭하면 상세 분석으로 이동합니다</span>
        </div>
        <table id="project-table">
          <thead>
            <tr>
              <th>현장명</th><th>기간</th><th class="num">총 일수</th>
              <th class="num">작업가능일</th><th class="num">비작업일</th>
              <th class="num">작업가능률</th><th>사유 비중</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="panel" style="margin-top:16px;">
        <div class="panel-head">
          <h3>월별 비작업일수 추이 (전체 현장 합계)</h3>
        </div>
        <div id="month-chart"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script src="js/sw-catalog.js"></script>
<script>
document.addEventListener('DOMContentLoaded', ()=>{
  renderTopbar('종합 현황');
  const db = loadDB();

  if(!db.projects.length){
    document.getElementById('page-content').innerHTML += '<div class="empty">등록된 현장이 없습니다. 현장 관리에서 현장을 추가하세요.</div>';
    return;
  }

  const results = db.projects.map(p=>{
    const days = computeDailyStatus(p, db);
    const summary = summarizeStatus(days);
    return {project:p, summary};
  });

  const totalDays = results.reduce((s,r)=>s+r.summary.total,0);
  const totalWorking = results.reduce((s,r)=>s+r.summary.working,0);
  const totalNonWorking = results.reduce((s,r)=>s+r.summary.nonWorking,0);
  const avgRate = totalDays ? totalWorking/totalDays : 0;
  const thisMonth = monthLabel(fmtDate(new Date()));
  let thisMonthNonWorking = 0;
  results.forEach(r=>{
    const m = r.summary.monthly.find(x=>x.month===thisMonth);
    if(m) thisMonthNonWorking += m.nonWorking;
  });

  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card">
      <div class="label">등록 현장 수</div>
      <div class="value">${db.projects.length}<small> 개</small></div>
    </div>
    <div class="stat-card">
      <div class="label">전체 평균 작업가능률</div>
      <div class="value">${fmtNum(avgRate*100,1)}<small> %</small></div>
    </div>
    <div class="stat-card">
      <div class="label">누적 비작업일수</div>
      <div class="value">${totalNonWorking}<small> 일</small></div>
    </div>
    <div class="stat-card">
      <div class="label">이번 달(${thisMonth}) 예상 비작업일수</div>
      <div class="value">${thisMonthNonWorking}<small> 일</small></div>
    </div>`;

  const tbody = document.querySelector('#project-table tbody');
  tbody.innerHTML = results.map(r=>{
    const p = r.project, s = r.summary;
    const reasonBits = [];
    if(s.byReason.weekend) reasonBits.push(`<span class="tag tag-mute">주말 ${s.byReason.weekend}</span>`);
    if(s.byReason.holiday) reasonBits.push(`<span class="tag tag-red">공휴일 ${s.byReason.holiday}</span>`);
    if(s.byReason.weather) reasonBits.push(`<span class="tag tag-amber">기상 ${s.byReason.weather}</span>`);
    return `<tr onclick="location.href='project-detail.html?id=${p.id}'" style="cursor:pointer">
      <td><b>${p.name}</b><div class="muted" style="font-size:11.5px">${p.location}</div></td>
      <td class="mono">${p.startDate} ~ ${p.endDate}</td>
      <td class="num mono">${s.total}</td>
      <td class="num mono">${s.working}</td>
      <td class="num mono">${s.nonWorking}</td>
      <td class="num mono">${fmtNum(s.workableRate*100,1)}%</td>
      <td>${reasonBits.join(' ')}</td>
    </tr>`;
  }).join('');

  // simple month bar chart across all projects
  const monthMap = {};
  results.forEach(r=> r.summary.monthly.forEach(m=>{
    monthMap[m.month] = (monthMap[m.month]||0) + m.nonWorking;
  }));
  const months = Object.keys(monthMap).sort();
  const max = Math.max(1, ...Object.values(monthMap));
  document.getElementById('month-chart').innerHTML = `
    <div style="display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px;">
      ${months.map(m=>{
        const v = monthMap[m];
        const h = Math.max(4, Math.round(v/max*120));
        return `<div style="flex:1; text-align:center;">
          <div style="height:${h}px; background:var(--amber); border-radius:3px 3px 0 0; opacity:.85"></div>
          <div class="mono" style="font-size:10px; color:var(--ink-faint); margin-top:4px;">${m.slice(5)}</div>
          <div class="mono" style="font-size:10.5px; color:var(--ink-soft);">${v}</div>
        </div>`;
      }).join('')}
    </div>`;
});
</script>
</body>
</html>
