<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예측 오차 분석 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main id="page-content">
      <div class="page-head">
        <h2>예측 오차 분석</h2>
        <div class="desc">기상 기준으로 산정한 예측값과 현장에서 기록한 실제 작업 여부를 비교합니다. 과거 일자에 대해 실제 값을 입력하면 정확도가 계산됩니다.</div>
      </div>

      <div class="grid grid-3" id="stat-cards"></div>

      <div class="panel">
        <div class="panel-head">
          <h3>일자별 예측 vs 실제</h3>
          <span class="hint">실제 작업 여부를 체크하면 자동 저장됩니다</span>
        </div>
        <table>
          <thead><tr><th>일자</th><th>예측(산정값)</th><th>실제 작업 여부</th><th>일치</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script src="js/sw-catalog.js"></script>
<script>
function togglePrediction(date, checked){
  const db = loadDB();
  const pid = getCurrentProjectId(db);
  let rec = db.predictions.find(r=>r.projectId===pid && r.date===date);
  if(!rec){ rec = {projectId:pid, date, actualWorkable:checked}; db.predictions.push(rec); }
  else rec.actualWorkable = checked;
  saveDB(db);
  render();
}

function render(){
  const db = loadDB();
  const pid = getCurrentProjectId(db);
  const p = db.projects.find(x=>x.id===pid);
  const rows = document.getElementById('rows');
  if(!p){ rows.innerHTML = '<tr><td colspan="4"><div class="empty">현장을 먼저 등록하세요.</div></td></tr>'; return; }

  const days = computeDailyStatus(p, db);
  const today = fmtDate(new Date());
  const past = days.filter(d=> d.date <= today).slice(-45);

  const predMap = {};
  db.predictions.filter(r=>r.projectId===pid).forEach(r=> predMap[r.date] = r.actualWorkable);

  let matched = 0, recorded = 0;
  rows.innerHTML = past.map(d=>{
    const has = predMap.hasOwnProperty(d.date);
    const actual = has ? predMap[d.date] : null;
    if(has){ recorded++; if(actual === d.workable) matched++; }
    return `<tr>
      <td class="mono">${d.date}</td>
      <td>${d.workable ? '<span class="tag tag-green">작업가능</span>' : '<span class="tag tag-amber">비작업</span>'}</td>
      <td><label class="checkline"><input type="checkbox" ${actual?'checked':''} onchange="togglePrediction('${d.date}', this.checked)"> 실제 작업함</label></td>
      <td>${has ? (actual===d.workable ? '<span class="tag tag-green">일치</span>' : '<span class="tag tag-red">불일치</span>') : '<span class="tag tag-mute">미입력</span>'}</td>
    </tr>`;
  }).reverse().join('');

  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card"><div class="label">기록된 일수</div><div class="value">${recorded}<small> 일</small></div></div>
    <div class="stat-card"><div class="label">예측 일치</div><div class="value">${matched}<small> 일</small></div></div>
    <div class="stat-card"><div class="label">예측 정확도</div><div class="value">${recorded ? fmtNum(matched/recorded*100,1) : '-'}<small> %</small></div></div>`;
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderTopbar('예측 오차 분석', {showProjectSelect:true});
  render();
});
</script>
</body>
</html>
